name: build-and-deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "deploy/**"

permissions:
  contents: write
  packages: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/poe-tg-tracker
  CHART_VALUES: deploy/poe-tracker/values.yaml

jobs:
  build-and-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bump image tag in chart
        run: yq -i '.image.tag = strenv(GITHUB_SHA)' "$CHART_VALUES"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CHART_VALUES"
          git commit -m "deploy: poe-tg-tracker ${GITHUB_SHA::7}"
          git pull --rebase origin main
          git push origin HEAD:main
