{{- if .Values.exchangeService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "poe-tracker.fullname" . }}-exchange-service
  labels:
    {{- include "poe-tracker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.exchangeService.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "poe-tracker.name" . }}-exchange-service
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "poe-tracker.name" . }}-exchange-service
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: exchange-service
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["./exchange-service"]
          env:
            - name: GRPC_LISTEN_ADDR
              value: ":{{ .Values.exchangeService.port }}"
          envFrom:
            - configMapRef:
                name: {{ include "poe-tracker.fullname" . }}-config
            - secretRef:
                name: {{ required "existingSecret is required" .Values.existingSecret }}
          ports:
            - name: grpc
              containerPort: {{ .Values.exchangeService.port }}
          readinessProbe:
            grpc:
              port: {{ .Values.exchangeService.port }}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            grpc:
              port: {{ .Values.exchangeService.port }}
            periodSeconds: 20
            failureThreshold: 3
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "poe-tracker.fullname" . }}-exchange-service
  labels:
    {{- include "poe-tracker.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "poe-tracker.name" . }}-exchange-service
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: grpc
      port: {{ .Values.exchangeService.port }}
      targetPort: grpc
{{- end }}
