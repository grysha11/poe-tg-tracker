apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "poe-tracker.fullname" . }}-fetch
  labels:
    {{- include "poe-tracker.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.fetchCron.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.fetchCron.backoffLimit }}
      template:
        metadata:
          labels:
            {{- include "poe-tracker.selectorLabels" . | nindent 12 }}
        spec:
          restartPolicy: Never
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: fetcher
              image: "{{ .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["./fetcher"]
              envFrom:
                - configMapRef:
                    name: {{ include "poe-tracker.fullname" . }}-config
                - secretRef:
                    name: {{ required "existingSecret is required" .Values.existingSecret }}
