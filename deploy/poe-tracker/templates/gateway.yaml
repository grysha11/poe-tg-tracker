{{- if .Values.gateway.enabled }}
{{- if not .Values.exchangeService.enabled }}
{{- fail "gateway.enabled requires exchangeService.enabled (it proxies to exchange-service)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "poe-tracker.fullname" . }}-gateway
  labels:
    {{- include "poe-tracker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "poe-tracker.name" . }}-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "poe-tracker.name" . }}-gateway
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["./gateway"]
          env:
            - name: HTTP_LISTEN_ADDR
              value: ":{{ .Values.gateway.port }}"
          envFrom:
            - configMapRef:
                name: {{ include "poe-tracker.fullname" . }}-config
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "poe-tracker.fullname" . }}-gateway
  labels:
    {{- include "poe-tracker.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "poe-tracker.name" . }}-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.gateway.port }}
      targetPort: http
{{- end }}
