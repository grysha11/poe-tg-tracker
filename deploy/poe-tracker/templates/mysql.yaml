{{- if .Values.mysql.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "poe-tracker.fullname" . }}-mysql
  labels:
    {{- include "poe-tracker.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "poe-tracker.name" . }}-mysql
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "poe-tracker.name" . }}-mysql
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "existingSecret is required" .Values.existingSecret }}
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: "core"
          ports:
            - containerPort: 3306
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost"]
            periodSeconds: 5
            failureThreshold: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: schema
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: schema
          configMap:
            name: {{ include "poe-tracker.fullname" . }}-mysql-schema
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "poe-tracker.fullname" . }}-mysql
  labels:
    {{- include "poe-tracker.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "poe-tracker.name" . }}-mysql
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: 3306
      targetPort: 3306
{{- end }}
