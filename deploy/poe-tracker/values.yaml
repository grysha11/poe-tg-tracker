image:
  repository: ghcr.io/grysha11/poe-tg-tracker
  tag: 4c5cd5128c3366bad07de49a651b5660f841c69c
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-pull
existingSecret: poe-tracker-secrets
config:
  POE_LEAGUE: "Forbidden Rites"
  POE_CONTACT: "contact: zakharchenkoevhenii@gmail.com"
  LOG_LEVEL: "info"
migrate:
  enabled: true
  activeDeadlineSeconds: 600
revisionHistoryLimit: 2
fetchCron:
  schedule: "1 * * * *"
  backoffLimit: 3
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  ttlSecondsAfterFinished: 86400
vtgate:
  serviceName: vtgate
  externalName: vitess-homelab-vtgate-43f81d05.vitess.svc.cluster.local
mysql:
  enabled: false
sealedSecrets:
  enabled: true
exchangeService:
  replicas: 1
  port: 9090
gateway:
  replicas: 1
  port: 8080
metrics:
  port: 9464
  serviceMonitor:
    enabled: true
    interval: 30s
    labels: {}
otel:
  endpoint: "http://alloy.monitoring.svc.cluster.local:4317"
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
