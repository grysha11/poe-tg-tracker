  externalName: vitess-homelab-vtgate-43f81d05.vitess.svc.cluster.local
mysql:
  enabled: false
sealedSecrets:
  enabled: true
exchangeService:
  replicas: 1
  port: 9090
gateway:
  replicas: 1
  port: 8080
metrics:
  port: 9464
  serviceMonitor:
    enabled: true
    interval: 30s
    labels:
      release: kube-prometheus-stack
otel:
  endpoint: ""
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
