image:
  repository: ghcr.io/grysha11/poe-tg-tracker
  tag: 679219f504340d64a8b4b0dddbf9f9b514c829f1
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-pull
existingSecret: poe-tracker-secrets
config:
  POE_LEAGUE: "Forbidden Rites"
  POE_CONTACT: "contact: zakharchenkoevhenii@gmail.com"
  LOG_LEVEL: "info"
migrate:
