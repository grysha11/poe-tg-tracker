services:
  bot:
    build: .
    image: poe-tg-tracker:latest
    env_file:
      - .env
    environment:
      DB_PATH: /data/poetracker.db
    volumes:
      - poetracker-data:/data
    restart: unless-stopped

  fetch-cron:
    image: mcuadros/ofelia:latest
    depends_on:
      - bot
    command: daemon --docker
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      ofelia.job-run.fetch-hourly.schedule: "0 1 * * * *"
      ofelia.job-run.fetch-hourly.image: "poe-tg-tracker:latest"
      ofelia.job-run.fetch-hourly.command: "./fetcher"
      ofelia.job-run.fetch-hourly.volume: "poetracker-data:/data"
      ofelia.job-run.fetch-hourly.environment: "POE_CONTACT=${POE_CONTACT},FETCH_OUT_PATH=/data/last_fetch.json,DB_PATH=/data/poetracker.db,LOG_LEVEL=info"

volumes:
  poetracker-data:
