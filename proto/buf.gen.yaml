version: v2
inputs:
  - directory: .
    paths:
      - exchange
plugins:
  - local: ../.tools/protoc-gen-go
    out: ..
    opt: module=github.com/grysha11/poe-tg-tracker
  - local: ../.tools/protoc-gen-go-grpc
    out: ..
    opt: module=github.com/grysha11/poe-tg-tracker
  - local: ../.tools/protoc-gen-grpc-gateway
    out: ..
    opt: module=github.com/grysha11/poe-tg-tracker
