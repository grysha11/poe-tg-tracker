version: "2"
sql:
  - engine: "mysql"
    queries: "internal/db/queries"
    schema: "internal/db/schema.sql"
    gen:
      go:
        package: "dbgen"
        out: "internal/db/gen"
        emit_json_tags: true
        emit_interface: true
        overrides:
          - column: "currencies.is_placeholder"
            go_type: "bool"
